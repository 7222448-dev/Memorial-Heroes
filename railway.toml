# Railway деплой-конфіг.
# Railway сам розпізнає Node.js проєкт, але явні налаштування
# дають передбачуваний результат і healthcheck.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
